<title>Maymanta Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Hub Maymanta, estética Apple: fondo claro, tarjetas blancas, naranja de acento. Selector de sede (Barcelona/Ibiza/Keipa) + módulos. */
  :root{
    --bg:#f2f2f7; --surface:#ffffff; --surface-2:#ffffff;
    --fg:#1c1c1e; --muted:#8e8e93; --faint:#aeaeb2;
    --sep:rgba(60,60,67,.14); --border:rgba(60,60,67,.12);
    --accent:#f2740b; --accent-bright:#ff9500; --accent-bg:rgba(242,116,11,.12);
    --good:#1f9d4d; --good-bg:rgba(52,199,89,.16);
    --warn:#c77700; --warn-bg:rgba(255,159,10,.18);
    --info:#0a66c2; --info-bg:rgba(10,132,255,.14);
    --bad:#d7372b; --bad-bg:rgba(255,59,48,.14);
    --seg-bg:rgba(118,118,128,.12); --seg-sel:#ffffff;
    --navbg:rgba(248,248,250,.82);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
    --r-card:14px; --r-ctrl:10px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e;
    --fg:#ffffff; --muted:#8e8e93; --faint:#636366;
    --sep:rgba(84,84,88,.6); --border:rgba(84,84,88,.5);
    --accent:#ff9f0a; --accent-bright:#ff9f0a; --accent-bg:rgba(255,159,10,.2);
    --good:#30d158; --good-bg:rgba(48,209,88,.2);
    --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.2);
    --info:#0a84ff; --info-bg:rgba(10,132,255,.22);
    --bad:#ff453a; --bad-bg:rgba(255,69,58,.2);
    --seg-bg:rgba(118,118,128,.24); --seg-sel:#636366;
    --navbg:rgba(20,20,22,.82); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e;
    --fg:#ffffff; --muted:#8e8e93; --faint:#636366;
    --sep:rgba(84,84,88,.6); --border:rgba(84,84,88,.5);
    --accent:#ff9f0a; --accent-bright:#ff9f0a; --accent-bg:rgba(255,159,10,.2);
    --good:#30d158; --good-bg:rgba(48,209,88,.2);
    --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.2);
    --info:#0a84ff; --info-bg:rgba(10,132,255,.22);
    --bad:#ff453a; --bad-bg:rgba(255,69,58,.2);
    --seg-bg:rgba(118,118,128,.24); --seg-sel:#636366;
    --navbg:rgba(20,20,22,.82); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.47;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navbg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:30}
  h1,h2,h3{margin:0;letter-spacing:-.022em}
  button{font-family:inherit}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navbg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding-block:.5rem;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hwrap{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .logo{font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
  .logo b{color:var(--accent)}
  .tbtn{margin-left:auto;background:var(--seg-bg);border:none;color:var(--fg);border-radius:999px;width:2rem;height:2rem;font-size:.95rem;cursor:pointer}
  .venue{order:3;flex:1 1 100%;margin-top:.1rem}

  .seg{display:inline-flex;background:var(--seg-bg);border-radius:9px;padding:2px;gap:2px}
  .seg button{border:none;background:none;padding:.4rem .85rem;border-radius:7px;font:inherit;font-size:.85rem;font-weight:590;color:var(--fg);cursor:pointer;transition:background .18s}
  .seg button[aria-current="true"],.seg button[aria-selected="true"]{background:var(--seg-sel);box-shadow:0 1px 3px rgba(0,0,0,.14),0 1px 1px rgba(0,0,0,.04)}
  .seg.venue{display:flex;width:100%}
  .seg.venue button{flex:1;text-align:center}

  main{max-width:900px;margin:0 auto;padding-block:.3rem 3rem;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  section{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){section{animation:none}}

  .title{font-size:1.9rem;font-weight:700;letter-spacing:-.03em;margin:1.1rem 0 .2rem}
  .subtitle{color:var(--muted);font-size:.92rem;margin-bottom:1.1rem}
  .subtitle b{color:var(--accent)}

  .note-box{color:var(--muted);font-size:.82rem;margin-top:1.1rem;padding:0 .25rem;line-height:1.5}
  .note-box b{color:var(--fg);font-weight:600}

  /* tiles del hub */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
  .tile{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-card);padding:1rem;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:.5rem;transition:transform .12s,background .12s;min-height:118px}
  .tile:active{transform:scale(.97);background:var(--seg-bg)}
  .tile .ic{width:2.4rem;height:2.4rem;border-radius:10px;display:grid;place-items:center;font-size:1.25rem;background:var(--accent-bg)}
  .tile .nm{font-weight:650;font-size:1rem}
  .tile .st{color:var(--muted);font-size:.82rem;margin-top:auto}
  .tile.soon{opacity:.72}
  .tile .st.on{color:var(--good);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.3rem}
  .stat{background:var(--surface);border-radius:var(--r-card);padding:.85rem .95rem;border:.5px solid var(--border)}
  .stat .c{font-size:1.5rem;font-weight:700;line-height:1;letter-spacing:-.02em}
  .stat .t{font-size:.75rem;color:var(--muted);font-weight:500;margin-top:.3rem}

  .toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
  .search{flex:1 1 200px;min-width:0;background:var(--seg-bg);border:none;border-radius:var(--r-ctrl);padding:.6rem .85rem;font:inherit;font-size:.95rem;color:var(--fg)}
  .search::placeholder{color:var(--muted)}
  .search:focus{outline:2px solid var(--accent-bg)}
  select.sort{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-ctrl);padding:.55rem .7rem;font:inherit;color:var(--fg)}
  .filters{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1rem}
  .chip{background:var(--seg-bg);border:none;border-radius:999px;padding:.42rem .9rem;font:inherit;font-size:.84rem;font-weight:550;cursor:pointer;color:var(--fg);transition:background .15s}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff}

  .card{background:var(--surface);border-radius:var(--r-card);overflow:hidden;border:.5px solid var(--border)}
  .list .row{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:.8rem 1rem;position:relative;transition:background .12s}
  .list .row+.row::before{content:"";position:absolute;top:0;left:1rem;right:0;border-top:.5px solid var(--sep)}
  .list .row:active{background:var(--seg-bg)}
  .row-main{flex:1;min-width:0}
  .row-title{font-weight:600;font-size:1rem}
  .row-sub{color:var(--muted);font-size:.84rem;margin-top:.1rem}
  .row-sub2{color:var(--faint);font-size:.78rem;margin-top:.15rem}
  .row-trail{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
  .chev{color:var(--faint);font-size:1.15rem;line-height:1}

  .badge{display:inline-block;border-radius:999px;padding:.2rem .6rem;font-size:.74rem;font-weight:650;white-space:nowrap}
  .b-warn{background:var(--warn-bg);color:var(--warn)} .b-acc{background:var(--accent-bg);color:var(--accent)}
  .b-info{background:var(--info-bg);color:var(--info)} .b-good{background:var(--good-bg);color:var(--good)}
  .b-bad{background:var(--bad-bg);color:var(--bad)} .b-draft{background:var(--seg-bg);color:var(--muted)}

  .back{background:none;border:none;color:var(--accent);font:inherit;font-size:1rem;font-weight:500;cursor:pointer;padding:.5rem 0;margin-top:.4rem;display:inline-flex;align-items:center;gap:.2rem}
  .dhead{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;margin:.3rem 0 .1rem}
  .dhead h2{font-size:1.75rem;font-weight:700;letter-spacing:-.03em}
  .dmeta{color:var(--muted);font-size:.92rem;margin-bottom:1.1rem}

  .field{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-card);padding:.85rem .95rem;margin-bottom:.7rem}
  .field label{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:.45rem}
  select,textarea{width:100%;background:var(--seg-bg);border:none;border-radius:var(--r-ctrl);padding:.6rem .7rem;font:inherit;color:var(--fg)}
  select:focus,textarea:focus{outline:2px solid var(--accent-bg)}
  textarea{resize:vertical;min-height:3rem}
  .saved{font-size:.76rem;color:var(--good);font-weight:600;margin-top:.4rem;min-height:1rem}

  .seg.tabs{display:flex;width:100%;margin:1rem 0}
  .seg.tabs button{flex:1;text-align:center}

  .actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:var(--r-ctrl);padding:.6rem 1rem;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;border:none;transition:opacity .15s;text-decoration:none}
  .btn:active{opacity:.7}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--accent-bg);color:var(--accent)}

  .items .it{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;padding:.7rem 1rem;position:relative;font-size:.95rem}
  .items .it+.it::before{content:"";position:absolute;top:0;left:1rem;right:0;border-top:.5px solid var(--sep)}
  .items .it input[type=checkbox]{width:1.35rem;height:1.35rem;accent-color:var(--accent-bright);cursor:pointer}
  .it .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;color:var(--muted)}
  .it .s{font-size:.78rem;color:var(--muted)} .it.done .n{color:var(--faint)}
  .group-t{font-size:.78rem;color:var(--muted);font-weight:500;margin:0 0 .5rem .25rem}
  .empty{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-card);padding:1.8rem 1.2rem;text-align:center;color:var(--muted);font-size:.92rem}
  .empty .big{font-size:1.9rem;margin-bottom:.4rem}

  .tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--r-card);border:.5px solid var(--border)}
  table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:420px}
  th,td{text-align:left;padding:.65rem .8rem}
  td{border-top:.5px solid var(--sep)}
  th{font-size:.74rem;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  .cls{font-size:.74rem;font-weight:650;border-radius:999px;padding:.14rem .55rem;white-space:nowrap}

  .panel-link{display:block;background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-card);padding:1rem;text-decoration:none;color:inherit;display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
  .panel-link .chev{margin-left:auto}
  .bars{display:flex;flex-direction:column;gap:.5rem}
  .bar{display:grid;grid-template-columns:7.5rem 1fr auto;gap:.6rem;align-items:center;font-size:.85rem}
  .bar .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bt{display:block;background:var(--seg-bg);border-radius:6px;height:.8rem;overflow:hidden}
  .bar .bf{display:block;height:100%;background:var(--accent);border-radius:6px;min-width:3px}
  .bar .bv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;color:var(--muted)}
  .cpad{padding:1rem;margin-bottom:.9rem}
  .cpad h3{font-size:1rem;font-weight:650;margin-bottom:.15rem}
  .cpad .hint{color:var(--muted);font-size:.8rem;margin-bottom:.8rem}
  .me4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
  .me4 .b{border-radius:10px;padding:.55rem;text-align:center}
  .me4 .b .c{font-size:1.35rem;font-weight:700;line-height:1}
  .me4 .b .t{font-size:.72rem;color:var(--muted);margin-top:.2rem}
  details.cat{border-bottom:.5px solid var(--sep)}
  details.cat summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:.8rem .25rem;font-weight:600}
  details.cat summary::-webkit-details-marker{display:none}
  details.cat summary .n{color:var(--muted);font-weight:500;font-size:.85rem}
  details.cat summary .ar{color:var(--faint);transition:transform .15s}
  details.cat[open] summary .ar{transform:rotate(90deg)}
  .fichas-card{margin-top:.6rem}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
  @media (min-width:600px){.overlay{align-items:center;padding:16px}}
  .modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:1.3rem 1.3rem calc(1.3rem + env(safe-area-inset-bottom,0px))}
  @media (min-width:600px){.modal{border-radius:18px}}
  .modal .grip{width:36px;height:5px;border-radius:3px;background:var(--faint);margin:-.4rem auto .8rem}
  .modal h3{font-size:1.3rem;font-weight:700}
  .modal .mc{color:var(--muted);font-size:.88rem;margin:.15rem 0 1rem}
  .modal .close{float:right;background:var(--seg-bg);border:none;border-radius:999px;width:1.9rem;height:1.9rem;cursor:pointer;color:var(--muted)}
  .doc{background:var(--bg);border-radius:var(--r-card);padding:1rem}
  .doc h4{font-size:1rem;font-weight:700;margin-bottom:.1rem}
  .doc .dl{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;border-bottom:.5px solid var(--sep)}
  .doc .dl:last-child{border-bottom:none}
  .doc .dl span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .lock{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-ctrl);padding:.7rem .85rem;font-size:.82rem;font-weight:500;margin-top:1rem}
  .lock b{font-weight:700}
</style>

<header>
  <div class="hwrap">
    <span class="logo">May<b>manta</b></span>
    <button class="tbtn" id="theme" aria-label="Tema">◐</button>
    <div class="seg venue" id="venue">
      <button data-s="Barcelona" aria-current="true">Barcelona</button>
      <button data-s="Ibiza" aria-current="false">Ibiza</button>
      <button data-s="Keipa" aria-current="false">Keipa</button>
    </div>
  </div>
</header>

<main>
  <!-- HOME / HUB -->
  <section id="home">
    <h1 class="title">Hola 👋</h1>
    <p class="subtitle">Estás en <b id="home-sede">Maymanta Barcelona</b></p>
    <div class="tiles" id="tiles"></div>
    <div class="note-box">Cambia de local con el selector de arriba. <b>Barcelona</b> va con datos reales; <b>Ibiza</b> y <b>Keipa</b> están listas para cargar sus datos.</div>
  </section>

  <!-- EVENTOS: LISTA -->
  <section id="eventos" hidden>
    <button class="back" data-home>‹ Inicio</button>
    <h1 class="title">Eventos</h1>
    <p class="subtitle" id="ev-sede"></p>
    <div id="ev-body"></div>
  </section>

  <!-- EVENTOS: DETALLE -->
  <section id="detail" hidden>
    <button class="back" id="back-ev">‹ Eventos</button>
    <div class="dhead"><h2 id="d-nm"></h2><span id="d-pill"></span></div>
    <div class="dmeta" id="d-meta"></div>
    <div class="field"><label for="d-estado">Estado</label>
      <select id="d-estado"><option>Pendiente</option><option>En producción</option><option>Listo para entregar</option><option>Entregado</option><option>Borrador</option></select>
      <div class="saved" id="saved-estado"></div></div>
    <div class="field"><label for="d-notas">Notas internas</label>
      <textarea id="d-notas" placeholder="Incidencias, cambios, recordatorios…"></textarea>
      <div class="saved" id="saved-notas"></div></div>
    <div class="seg tabs" id="tabs">
      <button data-t="platos" aria-selected="true">Platos</button>
      <button data-t="produccion" aria-selected="false">Producción</button>
      <button data-t="compra" aria-selected="false">Compra</button>
    </div>
    <div id="pane"></div>
  </section>

  <!-- PLATOS & COSTES -->
  <section id="platos" hidden>
    <button class="back" data-home>‹ Inicio</button>
    <h1 class="title">Platos</h1>
    <p class="subtitle" id="pl-sede"></p>
    <div id="pl-body"></div>
  </section>

  <!-- COSTOS / %FC -->
  <section id="costos" hidden>
    <button class="back" data-home>‹ Inicio</button>
    <h1 class="title">Costos · %FC</h1>
    <p class="subtitle" id="co-sede"></p>
    <div id="co-body"></div>
  </section>

  <!-- FICHAS -->
  <section id="fichas" hidden>
    <button class="back" data-home>‹ Inicio</button>
    <h1 class="title">Fichas técnicas</h1>
    <p class="subtitle">Recetas y sub-preparaciones</p>
    <div id="fi-body"></div>
  </section>

  <!-- KARDEX -->
  <section id="kardex" hidden>
    <button class="back" data-home>‹ Inicio</button>
    <h1 class="title">Kardex · Inventario</h1>
    <p class="subtitle" id="ka-sede"></p>
    <div id="ka-body"></div>
  </section>
</main>
<div id="modal-root"></div>

  function drawFichas(){
    var body=$("#fi-body");
    var sub=FICHAS.filter(function(f){return f.g===fgrupo && (!fbusca || f.n.toLowerCase().indexOf(fbusca)>=0)});
    var secs=[],map={};
    sub.forEach(function(f){if(!map[f.c]){map[f.c]=[];secs.push(f.c)}map[f.c].push(f)});
    var op=fbusca?" open":"";
    var html='<div class="toolbar"><input class="search" id="fq" type="search" placeholder="Buscar ficha" value="'+fbusca.replace(/"/g,"&quot;")+'"></div>'+
      '<div class="filters" id="fchips"><button class="chip" data-g="Platos" aria-pressed="'+(fgrupo==="Platos")+'">Platos</button><button class="chip" data-g="Recetas y sub-preparaciones" aria-pressed="'+(fgrupo!=="Platos")+'">Recetas y bases</button></div>'+
      '<div class="subtitle" style="margin:.1rem 0 .4rem .25rem">'+sub.length+' fichas</div>';
    if(!secs.length)html+='<div class="empty">Sin fichas que coincidan.</div>';
    secs.forEach(function(c){html+='<details class="cat"'+op+'><summary><span>'+c+' <span class="n">'+map[c].length+'</span></span><span class="ar">›</span></summary><div class="card list fichas-card">'+
      map[c].map(function(f){return '<button class="row" data-f="'+f.n.replace(/"/g,"&quot;")+'"><div class="row-main"><div class="row-title" style="font-size:.95rem;font-weight:550">'+f.n+'</div></div><div class="row-trail">'+(f.p?'<span class="badge b-draft">'+f.p+' €</span>':'')+'<span class="chev">›</span></div></button>'}).join("")+'</div></details>';});
    body.innerHTML=html;
    var fq=$("#fq");fq.addEventListener("input",function(){fbusca=this.value.trim().toLowerCase();drawFichas()});
    if(fbusca){fq.focus();try{fq.setSelectionRange(fq.value.length,fq.value.length)}catch(e){}}
    $("#fchips").addEventListener("click",function(ev){var b=ev.target.closest(".chip");if(!b)return;fgrupo=b.dataset.g;fbusca="";drawFichas()});
    body.querySelectorAll(".row[data-f]").forEach(function(b){b.addEventListener("click",function(){fichaModal(b.dataset.f)})});
  }
  function fichaModal(n){
    var ov=document.createElement("div");ov.className="overlay";
    ov.innerHTML='<div class="modal"><div class="grip"></div><button class="close" aria-label="Cerrar">✕</button><h3>'+n+'</h3><div class="mc">Ficha técnica de Maymanta</div><div class="doc">La ficha en PDF (ingredientes, pasos y escandallo) se abre y descarga <b>cuando la app esté en tu Vercel</b>. La genera tu skill de fichas; la web solo la muestra.</div><div class="lock">En esta vista previa de Claude la descarga está bloqueada.</div></div>';
    ov.addEventListener("click",function(ev){if(ev.target===ov||ev.target.classList.contains("close"))ov.remove()});$("#modal-root").appendChild(ov);
  }

  /* ----- KARDEX ----- */
  function renderKardex(){
    $("#ka-sede").textContent="Inventario · "+sede;
    var body=$("#ka-body"),c;
    if(sede==="Barcelona")c='<div class="stats"><div class="stat"><div class="c">21.690 €</div><div class="t">Valor inventario</div></div><div class="stat"><div class="c">03-11</div><div class="t">Último conteo</div></div><div class="stat"><div class="c">ABC</div><div class="t">Clasificación</div></div></div><div class="note-box">Último inventario valorado con el BDM. Aquí irá el Kardex con entradas, salidas, existencias, mínimos y control ABC (A diario · B semanal · C quincenal). <b>Sin conteo no es stock cero.</b></div>';
    else if(sede==="Ibiza")c='<div class="empty"><div class="big">📦</div><b>Ibiza · cierre de temporada.</b><br>Hay inventario de cierre y catálogo visual de códigos. Se cargará aquí valorado con el BDM.</div>';
    else c='<div class="empty"><div class="big">📦</div>El inventario de <b>Keipa</b> está por configurar.</div>';
    body.innerHTML=c;
  }

  /* ----- tema ----- */
  $("#theme").addEventListener("click",function(){var r=document.documentElement,cur=r.getAttribute("data-theme");var sd=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;var n=cur?(cur==="dark"?"light":"dark"):(sd?"light":"dark");r.setAttribute("data-theme",n);try{localStorage.setItem("mm-theme",n)}catch(e){}});
  try{var th=localStorage.getItem("mm-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}

  renderHome();
})();
</script>
